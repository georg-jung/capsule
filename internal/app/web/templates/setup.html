{{define "setup.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Set up private app</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="capsule-mark" aria-hidden="true">C</div>
    <h1>Set up your private app</h1>
    <p>The first successful passkey registration claims this instance.</p>
    <form id="setup-form">
      <label>App name<input name="siteName" required maxlength="80" autocomplete="organization"></label>
      <label>Your name<input name="personName" required maxlength="100" autocomplete="name"></label>
      <button type="submit">Create owner passkey</button>
    </form>
    <p id="auth-status" class="status" role="status" aria-live="polite"></p>
  </main>
  <script src="/assets/auth.js" defer></script>
</body>
</html>
{{end}}
