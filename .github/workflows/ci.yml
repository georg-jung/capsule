name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

  browser:
    name: Passkey and offline browser lifecycle
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Playwright lifecycle
        run: npm test

  container:
    name: Container build and smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET for NBGV
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore versioning tool
        run: dotnet tool restore
      - name: Calculate deterministic version
        id: version
        run: echo "semver=$(dotnet nbgv get-version -v SemVer2)" >> "$GITHUB_OUTPUT"
      - name: Build production image
        run: docker build --build-arg VERSION=${{ steps.version.outputs.semver }} -t capsule:ci .
      - name: Start container
        run: docker run --rm -d --name capsule-smoke -p 127.0.0.1:18081:8080 -e CAPSULE_ORIGIN=http://localhost:18081 capsule:ci
      - name: Wait for health
        run: |
          for _ in {1..30}; do
            if curl --fail --silent http://localhost:18081/healthz >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs capsule-smoke
          exit 1
      - name: Verify image command
        run: test "$(docker exec capsule-smoke /capsule version)" = "${{ steps.version.outputs.semver }}"
      - name: Stop container
        if: always()
        run: docker stop capsule-smoke || true
