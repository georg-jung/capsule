name: Publish container

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up .NET for NBGV
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Restore versioning tool
        run: dotnet tool restore
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          semver="$(dotnet nbgv get-version -v SemVer2)"
          major_minor="$(dotnet nbgv get-version -v MajorMinorVersion)"
          public_release="$(dotnet nbgv get-version -v PublicRelease | tr '[:upper:]' '[:lower:]')"
          {
            echo "semver=$semver"
            echo "major_minor=$major_minor"
            echo "public_release=$public_release"
          } >> "$GITHUB_OUTPUT"
      - name: Validate public release tag
        if: github.event_name == 'push'
        env:
          PUBLIC_RELEASE: ${{ steps.version.outputs.public_release }}
          RELEASE_VERSION: ${{ steps.version.outputs.semver }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$PUBLIC_RELEASE" != "true" ]]; then
            echo "Tag $RELEASE_TAG is not an NBGV public release." >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$RELEASE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match NBGV version v$RELEASE_VERSION." >&2
            exit 1
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.public_release == 'true' }}
            type=raw,value=${{ steps.version.outputs.semver }},enable=${{ steps.version.outputs.public_release == 'true' }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.public_release == 'true' }}
            type=raw,value=manual-${{ steps.version.outputs.semver }},enable=${{ steps.version.outputs.public_release != 'true' }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Capsule
            org.opencontainers.image.description=Private passkey-gated host for standalone HTML files
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.version=${{ steps.version.outputs.semver }}
      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.semver }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
      - name: Publish GitHub release
        if: steps.version.outputs.public_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" --verify-tag --generate-notes --title "Capsule ${{ steps.version.outputs.semver }}"
          fi
